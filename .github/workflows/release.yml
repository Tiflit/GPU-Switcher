name: Release GPU-Switcher

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "GPU-Switcher-${tag}-windows-x64.zip"
          Compress-Archive -Path "build/GPU-Switcher.exe", "README.md", "LICENSE" -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash
          "$hash  $zipName" | Out-File -Encoding ascii -FilePath "${zipName}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GPU-Switcher-*-windows-x64.zip
            GPU-Switcher-*-windows-x64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
